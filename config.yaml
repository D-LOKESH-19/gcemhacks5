steps_per_episode: 200      # 1 step = 100 ms of simulated time
prb_total: 100
vcpu_total: 8
prb_rate: 12                # packets per PRB per step
cpu_rate: 200               # packets per vCPU per step
slices: [embb, urllc, murllc]
arrival_mean:
  embb: 400
  urllc: 30
  murllc: 20
spike_factor:
  embb: 2.5
  urllc: 3.0
  murllc: 7.0
queue_max:
  embb: 2000
  urllc: 0
  murllc: 0   # 0 means no queue: missed deadline = violation
shield_floor:
  urllc: 0.15
  murllc: 0.15
cost_limit: 0.01            # max allowed average violation rate for urllc+murllc
lagrange_lr: 0.05

# Phase 9: Bots Feature Configuration
traffic_mode: bots          # aggregate | bots
bots:
  default_count:
    embb: 40
    urllc: 30
    murllc: 100
  max_count:
    embb: 200
    urllc: 150
    murllc: 1000
  per_bot_mean:
    embb: 10.0
    urllc: 1.0
    murllc: 0.2
  embb:
    p_on: 0.20
    p_off: 0.30
    rate_on: 25.0
  urllc:
    period_steps: 10
    jitter: 0.10
  murllc:
    p_burst: 0.02
    burst_len: 3
    rate_burst: 3.33
train_bot_range:
  low: 0.3
  high: 3.0
