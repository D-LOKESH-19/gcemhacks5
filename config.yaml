steps_per_episode: 200      # 1 step = 100 ms of simulated time
prb_total: 100
vcpu_total: 8
prb_rate: 12                # packets per PRB per step
cpu_rate: 200               # packets per vCPU per step
slices: [embb, urllc, murllc]
arrival_mean:
  embb: 400
  urllc: 30
  murllc: 20
spike_factor:
  embb: 2.5
  urllc: 3.0
  murllc: 7.0
queue_max:
  embb: 2000
  urllc: 0
  murllc: 0   # 0 means no queue: missed deadline = violation
shield_floor:
  urllc: 0.15
  murllc: 0.15
cost_limit: 0.01            # max allowed average violation rate for urllc+murllc
lagrange_lr: 0.05

sla:
  window_steps: 20
  embb:   {min_served_ratio: 0.70}
  urllc:  {max_violation_rate: 0.005, max_window_violation: 0.02}
  murllc: {max_violation_rate: 0.01,  max_window_violation: 0.03}
  feasible_load_fraction: 0.90
  amber_fraction: 0.80        # UI turns amber above 80 percent of a limit
cmdp:
  limits: {embb_shortfall: 0.05, urllc: 0.005, murllc: 0.01}
  lambda_init: 1.0
  lambda_max: 20.0
  lagrange_lr: 0.05
  dual_mode: simple           # simple | pid
  pid: {kp: 0.5, ki: 0.05, kd: 0.1}

# Phase 9: Bots Feature Configuration
traffic_mode: bots          # aggregate | bots
bots:
  default_count:
    embb: 40
    urllc: 30
    murllc: 100
  max_count:
    embb: 200
    urllc: 150
    murllc: 1000
  per_bot_mean:
    embb: 10.0
    urllc: 1.0
    murllc: 0.2
  embb:
    p_on: 0.20
    p_off: 0.30
    rate_on: 25.0
  urllc:
    period_steps: 10
    jitter: 0.10
  murllc:
    p_burst: 0.02
    burst_len: 3
    rate_burst: 3.33
train_bot_range:
  low: 0.3
  high: 3.0

# Phase 10: Locations Feature Configuration
locations:
  campus:     {label: Campus,              default_slice: embb}
  factory:    {label: Factory,             default_slice: urllc}
  smart_city: {label: Smart City / IoT Zone, default_slice: murllc}
delay_model:                  # display only, never used in reward or cost
  base_ms: {embb: 10.0, urllc: 0.3, murllc: 2.0}
  rho_cap: 0.99
  overload_ms: 100.0


# Phase L: SLA-aware predictive resource lending (additive; mode off == original Agent + Shield)
lending:
  mode: predictive            # predictive | reactive | off
  bottleneck_aware: true
  forecast: {ewma_alpha: 0.4, trend_beta: 0.2, trend_damping: 0.8, residual_window: 50, burst_quantile: 0.95, default_margin_fraction: 0.30}
  risk: {high: 0.30, low: 0.10, recall: 0.25, confirm_steps: 2, return_confirm_steps: 3}
  protected_margin: {embb: 1.0, urllc: 1.3, murllc: 1.3}   # embb uses the SLA served-ratio target
  max_loan_fraction: 0.30
  ramp_return_pct: 0.25
  ttl_steps: 30
  priority: [urllc, murllc, embb]
